name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - run: ruby -c bench/compare.rb
      - run: ruby bench/compare.rb --help
      - run: docker build -t once-campfire-express:test .
      - run: docker run --rm --tmpfs /rails/tmp:mode=1777 once-campfire-express:test npm test
